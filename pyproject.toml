[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vastu-floorplan-analyzer"
version = "2.2.0"
description = "A simple Vastu Shastra checker for house maps: draw your house, get a score out of 100 and easy suggestions. Pure Python, no AI/ML."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vastu-floorplan-analyzer contributors" }]
keywords = ["vastu", "floor-plan", "tkinter", "education", "architecture"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []  # only the Python standard library (tkinter is part of it)

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
vastu = "vastu_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/madhukarverma/vastu-floorplan-analyzer"
Documentation = "https://github.com/madhukarverma/vastu-floorplan-analyzer/tree/main/docs"
Issues = "https://github.com/madhukarverma/vastu-floorplan-analyzer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vastu_analyzer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs/*.md", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/vastu_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["vastu_analyzer"]
omit = ["*/app.py", "*/__main__.py"]  # the window app is tried by hand

[tool.coverage.report]
show_missing = true
fail_under = 85
